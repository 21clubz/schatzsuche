[package]
name = "schatzsuche"
version = "0.1.0"
edition = "2021"
description = "Rät zufällige BIP-39-Wallets und misst die Aussichtslosigkeit in Vielfachen des Universumsalters."
authors = ["21clubz"]
license = "MIT"
readme = "README.md"
keywords = ["bitcoin", "bip39", "keyspace", "benchmark"]
categories = ["command-line-utilities"]

[dependencies]
getrandom = "0.2"
secp256k1 = { version = "0.29", features = ["std"] }
# The `asm` feature is added per platform below: `sha2-asm` refuses to build
# for Windows outright, and PBKDF2 is a third of the runtime, so this cannot
# simply be left on everywhere.
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
rayon = "1"
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
ureq = { version = "2", features = ["json", "tls"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "builder",
] }
notify-rust = "4"
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.29"
bip39 = "2"
num_cpus = "1"
# Only to decode the embedded icon at startup. Pure Rust, no C dependency.
png = "0.17"

# Unix-only: hostname, thread priority and the full-fsync barrier.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Hand-written SHA-512 compression, which on Apple silicon reaches the
# FEAT_SHA512 instructions and is worth about 30% of total throughput.
# `sha2-asm` has no Windows support at all — it fails the build rather than
# falling back — so Windows uses the portable implementation.
[target.'cfg(not(windows))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
bitcoin = "0.32"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Symbols made the Linux binary 68 MB. Nobody downloads that to look at a
# counter; `profiling` below keeps them for when they are actually wanted.
strip = true

# For `cargo build --profile profiling` when a profiler needs symbols.
[profile.profiling]
inherits = "release"
strip = false
debug = 1

[profile.bench]
inherits = "release"
