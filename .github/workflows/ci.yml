name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # eframe needs the X11/Wayland and GTK development headers to build.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --release --verbose

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      # Proves the whole pipeline works on this platform, not just that it
      # compiles: builds a database, plants a known seed, and finds it.
      - name: End-to-end check
        run: cargo run --release -- verify-lookup

      - name: Persistence self-test
        run: cargo run --release -- --data-dir ci-data --test-persistence
